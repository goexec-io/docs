name: Links externos

# Links externos NAO entram no CI de PR: eles quebram por motivo alheio a quem
# abriu o PR (o site do outro caiu, mudou de endereco, bloqueou robo), e um
# check vermelho que nao e culpa do autor ensina todo mundo a ignorar check
# vermelho. Aqui eles sao verificados uma vez por semana e viram uma issue.
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Verificar links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --max-concurrency 4
            --accept 200,206,301,302,403,429
            --exclude-path node_modules
            'src/content/docs/**/*.md'
            'src/content/docs/**/*.mdx'
            'README.md'
            'CONTRIBUTING.md'
          fail: false

      - name: Abrir issue se houver link morto
        if: env.lychee_exit_code != 0
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: Links externos quebrados
          content-filepath: ./lychee/out.md
          labels: documentacao, manutencao
